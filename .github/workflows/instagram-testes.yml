# Roda os testes automáticos da automação (sem internet, sem publicar).
name: "Instagram · Testes"

on:
  push:
    paths: ["instagram-automation/automacao/**", "instagram-automation/testes/**", "instagram-automation/conteudo/**"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r instagram-automation/requirements.txt
      - working-directory: instagram-automation
        run: python -m unittest discover -s testes -v
