# Reage aos seus comentários na issue: /aprovar, /rejeitar ou /outra.
# Só publica com /aprovar escrito pela dona do repositório.
name: "Instagram · 2. Aprovar ou rejeitar"

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed]

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-automacao
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  decidir:
    # Só roda em issues da automação e nunca para comentários de robôs.
    if: >-
      contains(github.event.issue.labels.*.name, 'instagram') &&
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' || github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r instagram-automation/requirements.txt
      - name: Aplicar a decisão
        working-directory: instagram-automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_PAUSADO: ${{ vars.INSTAGRAM_PAUSADO }}
          INSTAGRAM_MODO_TESTE: ${{ vars.INSTAGRAM_MODO_TESTE }}
        run: python -m automacao.decidir
